name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce lowercase brand
        run: |
          legacy_brand='IN''CLD'
          if git grep -n -I -E "(^|[^[:alnum:]_])${legacy_brand}([^[:alnum:]_]|$)"; then
            echo "Use incld, @incld, or incld.dev in public-facing text."
            exit 1
          fi
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: 1.19.5
          otp-version: 28.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix test
      - run: mix hex.build
      - run: mix docs --warnings-as-errors
